<!DOCTYPE html>

<html>

<head>

    <title>Registration - Online Book Store</title>

</head>

<body bgcolor="#F2F6FA">

<table border="2" width="95%" align="center" cellspacing="0" cellpadding="5"
       bordercolor="#34495E">


    <!-- Header -->
    <tr bgcolor="#2C3E50" height="80">

        <td width="12%" align="center">

            <img src="846imguf_LogoGLBajaj.jpg"
                 width="55" height="55" alt="College Logo">

        </td>

        <td colspan="5" align="center">

            <font color="white" size="6">

                <b>ONLINE BOOK STORE</b>

            </font>

        </td>

    </tr>


    <!-- Navigation -->
    <tr bgcolor="#3498DB" align="center">

        <td>

            <a href="index.html">

                <font color="white">

                    <b>HOME</b>

                </font>

            </a>

        </td>


        <td>

            <a href="login.html">

                <font color="white">

                    <b>LOGIN</b>

                </font>

            </a>

        </td>


        <td>

            <a href="catalogue.html">

                <font color="white">

                    <b>CATALOGUE</b>

                </font>

            </a>

        </td>


        <td>

            <a href="cart.html">

                <font color="white">

                    <b>CART</b>

                </font>

            </a>

        </td>


        <td>

            <a href="registration.html">

                <font color="white">

                    <b>REGISTER</b>

                </font>

            </a>

        </td>


        <td>

            <font color="white">

                Welcome to our Book Store

            </font>

        </td>

    </tr>


    <!-- Registration Heading -->
    <tr>

        <td colspan="6" bgcolor="white" align="center">

            <br>

            <font color="#2C3E50" size="5">

                <b>REGISTRATION FORM</b>

            </font>

            <br><br>

        </td>

    </tr>


    <!-- Registration Form -->
    <tr>

        <td colspan="6" bgcolor="white" align="center">

            <form>


                <table border="0" cellspacing="8" cellpadding="5"
                       align="center">


                    <!-- Name -->
                    <tr>

                        <td align="right">

                            <font color="#2C3E50">

                                <b>Name:</b>

                            </font>

                        </td>

                        <td>

                            <input type="text" name="name">

                        </td>

                    </tr>


                    <!-- Password -->
                    <tr>

                        <td align="right">

                            <font color="#2C3E50">

                                <b>Password:</b>

                            </font>

                        </td>

                        <td>

                            <input type="password" name="password">

                        </td>

                    </tr>


                    <!-- Email -->
                    <tr>

                        <td align="right">

                            <font color="#2C3E50">

                                <b>Email:</b>

                            </font>

                        </td>

                        <td>

                            <input type="email" name="email">

                        </td>

                    </tr>


                    <!-- Phone Number -->
                    <tr>

                        <td align="right">

                            <font color="#2C3E50">

                                <b>Phone Number:</b>

                            </font>

                        </td>

                        <td>

                            <input type="text" name="phone">

                        </td>

                    </tr>


                    <!-- Sex -->
                    <tr>

                        <td align="right">

                            <font color="#2C3E50">

                                <b>Sex:</b>

                            </font>

                        </td>

                        <td>

                            <input type="radio" name="sex" value="male">

                            Male


                            <input type="radio" name="sex" value="female">

                            Female


                            <input type="radio" name="sex" value="other">

                            Other

                        </td>

                    </tr>


                    <!-- Date of Birth -->
                    <tr>

                        <td align="right">

                            <font color="#2C3E50">

                                <b>Date of Birth:</b>

                            </font>

                        </td>

                        <td>

                            <select name="day">

                                <option>Day</option>

                                <option>1</option>

                                <option>2</option>

                                <option>3</option>

                                <option>4</option>

                                <option>5</option>

                                <option>6</option>

                                <option>7</option>

                                <option>8</option>

                                <option>9</option>

                                <option>10</option>

                                <option>11</option>

                                <option>12</option>

                                <option>13</option>

                                <option>14</option>

                                <option>15</option>

                                <option>16</option>

                                <option>17</option>

                                <option>18</option>

                                <option>19</option>

                                <option>20</option>

                                <option>21</option>

                                <option>22</option>

                                <option>23</option>

                                <option>24</option>

                                <option>25</option>

                                <option>26</option>

                                <option>27</option>

                                <option>28</option>

                                <option>29</option>

                                <option>30</option>

                                <option>31</option>

                            </select>


                            <select name="month">

                                <option>Month</option>

                                <option>January</option>

                                <option>February</option>

                                <option>March</option>

                                <option>April</option>

                                <option>May</option>

                                <option>June</option>

                                <option>July</option>

                                <option>August</option>

                                <option>September</option>

                                <option>October</option>

                                <option>November</option>

                                <option>December</option>

                            </select>


                            <select name="year">

                                <option>Year</option>

                                <option>2000</option>

                                <option>2001</option>

                                <option>2002</option>

                                <option>2003</option>

                                <option>2004</option>

                                <option>2005</option>

                                <option>2006</option>

                                <option>2007</option>

                                <option>2008</option>

                                <option>2009</option>

                                <option>2010</option>

                            </select>

                        </td>

                    </tr>


                    <!-- Language -->
                    <tr>

                        <td align="right">

                            <font color="#2C3E50">

                                <b>Language Known:</b>

                            </font>

                        </td>

                        <td>

                            <input type="checkbox" name="language"
                                   value="english">

                            English


                            <input type="checkbox" name="language"
                                   value="hindi">

                            Hindi


                            <input type="checkbox" name="language"
                                   value="urdu">

                            Urdu


                            <input type="checkbox" name="language"
                                   value="other">

                            Other

                        </td>

                    </tr>


                    <!-- Address -->
                    <tr>

                        <td align="right" valign="top">

                            <font color="#2C3E50">

                                <b>Address:</b>

                            </font>

                        </td>

                        <td>

                            <textarea name="address"
                                      rows="4"
                                      cols="30"></textarea>

                        </td>

                    </tr>


                    <!-- Buttons -->
                    <tr>

                        <td colspan="2" align="center">

                            <br>

                            <input type="submit" value="Register">

                            &nbsp;&nbsp;

                            <input type="reset" value="Reset">

                        </td>

                    </tr>


                </table>


            </form>

            <br>

        </td>

    </tr>


</table>

</body>

</html>
